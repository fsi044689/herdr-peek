[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-quickview"
version = "0.1.1"
description = "Preview files and HTTP(S) links in Herdr terminals"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["prompt-toolkit>=3.0.50,<4", "pygments>=2.18,<3", "Pillow>=11,<14"]

[tool.setuptools.packages.find]
include = ["herdr_quickview*"]
